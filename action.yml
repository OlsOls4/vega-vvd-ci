name: "Vega Virtual Device (VVD) runner"
description: "Install the Amazon Vega SDK on a GitHub-hosted Ubuntu runner and boot the Vega Virtual Device (Fire TV emulator) headlessly with non-black screenshots, screen recording and remote-key input. No Docker, no GPU."
author: "OlsOls4"
branding:
  icon: "tv"
  color: "orange"
inputs:
  sdk-version:
    description: "Vega SDK version to install, e.g. 0.24.12112 (blank = latest)"
    required: false
    default: ""
  boot:
    description: "background | foreground | none — when to boot the VVD"
    required: false
    default: "background"
  boot-timeout:
    description: "Seconds to wait for a non-black home screen"
    required: false
    default: "480"
  cache:
    description: "Cache ~/vega between runs (true/false)"
    required: false
    default: "true"
  artifacts-dir:
    description: "Where logs/screenshots go (relative to the workspace, or absolute)"
    required: false
    default: "artifacts"
outputs:
  vega-version:
    description: "Output of vega --version"
    value: ${{ steps.install.outputs.version }}
  artifacts-dir:
    description: "Absolute path of the artifacts dir (also exported as $OUT)"
    value: ${{ steps.validate.outputs.out }}
  display:
    description: "X display the VVD renders on (also exported as $DISPLAY)"
    value: ${{ steps.validate.outputs.display }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        IN_BOOT: ${{ inputs.boot }}
        IN_TIMEOUT: ${{ inputs.boot-timeout }}
        IN_CACHE: ${{ inputs.cache }}
        IN_SDK: ${{ inputs.sdk-version }}
        IN_OUT: ${{ inputs.artifacts-dir }}
      run: bash "${{ github.action_path }}/scripts/validate-inputs.sh"
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -la /dev/kvm
    - name: Host dependencies (Xvfb, Mesa llvmpipe, ffmpeg, lz4)
      shell: bash
      run: |
        # man-db triggers can stall apt for minutes on ubuntu-24.04 runners
        sudo rm -f /var/lib/man-db/auto-update
        apt_opts=(-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3)
        for n in 1 2 3; do
          sudo timeout 300 apt-get "${apt_opts[@]}" update -qq && break
          echo "apt-get update attempt $n failed"; sleep 5
        done
        for n in 1 2 3; do
          sudo timeout 600 apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends \
            lz4 jq xvfb x11-utils mesa-utils libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 \
            libx11-xcb1 libxcb1 ffmpeg iproute2 >/dev/null && break
          echo "apt-get install attempt $n failed"; sleep 5
          [[ $n == 3 ]] && exit 1
        done
    - name: Restore Vega SDK cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/vega
          !~/vega/sdk/vega-sdk/main/*/vvd/instances
        # "latest" is bucketed by month so a new SDK release is picked up within a month.
        key: vega-sdk-${{ runner.os }}-${{ steps.validate.outputs.sdk-key }}-v3
    - name: Install Vega SDK (CLI + SDK + VVD)
      id: install
      shell: bash
      env:
        NONINTERACTIVE: "true"
        KEPLER_CSAT_DISABLED: "true"
        VEGA_SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        t0=$SECONDS
        if [[ ! -x ~/vega/bin/vega ]]; then
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o /tmp/get_vvm.sh
          for n in 1 2 3; do bash /tmp/get_vvm.sh && break; echo "install attempt $n failed"; sleep 10; done
        fi
        echo "$HOME/vega/bin" >> "$GITHUB_PATH"
        echo "${{ github.action_path }}/scripts" >> "$GITHUB_PATH"
        {
          echo "DISPLAY=${{ steps.validate.outputs.display }}"
          echo "KEPLER_CSAT_DISABLED=true"
          echo "OUT=${{ steps.validate.outputs.out }}"
        } >> "$GITHUB_ENV"
        v=$(~/vega/bin/vega --version | tr '\n' ' '); echo "$v"
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "Vega SDK ready in $((SECONDS-t0))s"
    - name: Boot VVD
      if: inputs.boot != 'none'
      shell: bash
      env:
        VVD_BOOT_TIMEOUT: ${{ inputs.boot-timeout }}
        VVD_DISPLAY: ${{ steps.validate.outputs.display }}
      run: |
        mkdir -p "$OUT/logs"
        if [[ "${{ inputs.boot }}" == "foreground" ]]; then
          "${{ github.action_path }}/scripts/start-vvd.sh" 2>&1 | tee "$OUT/logs/start-vvd.log"
          echo "${PIPESTATUS[0]}" > "$OUT/vvd-exit"; test "$(cat "$OUT/vvd-exit")" = 0
        else
          nohup bash -c '"$0" > "$OUT/logs/start-vvd.log" 2>&1; echo $? > "$OUT/vvd-exit"' \
            "${{ github.action_path }}/scripts/start-vvd.sh" >/dev/null 2>&1 &
          echo "VVD booting in background — run wait-vvd.sh before using it"
        fi
