name: test

# Fast checks with no emulator and no Vega SDK (< 1 min): lint every script and
# workflow, unit-test the helper scripts against a stub `vega` CLI and a fake
# emulator console, and check that the action rejects bad inputs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/*.yml examples/*.yml
      - name: python syntax
        run: python3 -m py_compile scripts/vvd-console.py

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - name: ffmpeg (for the contact-sheet test)
        run: |
          # skip man-db triggers, which make apt very slow on ubuntu-24.04 runners
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          ffmpeg -version | head -1
      - name: pytest (press, wait, screenshot, console, kill, inputs, contact sheet)
        run: python -m pytest -v tests

  action-rejects-bad-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          boot: backgorund   # typo on purpose
      - name: Expect the action to fail fast on the typo
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          test "$OUTCOME" = failure
