name: Vega VVD — build, boot, run, record

# Builds a Vega OS (Fire TV) React Native app and runs it on the Vega Virtual
# Device (VVD) directly on a free GitHub-hosted ubuntu-24.04 runner — no Docker,
# no GPU. Captures step screenshots, a 1080p screen recording, and drives the
# app with D-pad (remote) key presses.

on:
  workflow_dispatch:
    inputs:
      sdk-version:
        description: "Vega SDK version (blank = latest)"
        required: false
        default: ""
      template:
        description: "Vega project template"
        required: false
        default: "helloWorld"
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tests/**", "examples/**"]
  # Weekly end-to-end run against the latest Vega SDK, so the badge shows the
  # recipe still works (Mondays 06:17 UTC).
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: vvd-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  TEMPLATE: ${{ github.event.inputs.template || 'helloWorld' }}
  APP_DIR: app
  APP_NAME: HelloVega
  PACKAGE_ID: com.olsols4.hellovega

jobs:
  vvd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Regression canary for the v0 `pkill -9 -x node` bug: an unrelated `node`
      # process (like a concurrent npm build) must survive the VVD boot.
      - name: Start unrelated node canary
        run: |
          nohup node -e 'setInterval(() => {}, 1 << 30)' >/dev/null 2>&1 &
          echo $! > /tmp/node-canary.pid
          echo "canary pid $(cat /tmp/node-canary.pid)"

      # Installs the SDK, enables KVM, boots the VVD in the background.
      - id: vvd
        uses: ./
        with:
          sdk-version: ${{ github.event.inputs.sdk-version || '' }}
          boot: background

      - name: Action outputs
        env:
          V: ${{ steps.vvd.outputs.vega-version }}
          A: ${{ steps.vvd.outputs.artifacts-dir }}
          D: ${{ steps.vvd.outputs.display }}
        run: |
          echo "vega-version=$V"; echo "artifacts-dir=$A"; echo "display=$D"
          test -n "$A" && test "$A" = "$OUT" && test -n "$D"

      - name: Build app (while the VVD boots)
        run: build-app.sh 2>&1 | tee "$OUT/logs/build.log"

      - name: Wait for VVD
        run: wait-vvd.sh 600

      - name: Canary survived the boot
        run: |
          pid=$(cat /tmp/node-canary.pid)
          if kill -0 "$pid" 2>/dev/null; then echo "node canary $pid still alive"; else
            echo "::error::start-vvd.sh killed an unrelated node process"; exit 1; fi
          kill "$pid"

      - name: Run app, D-pad demo, screenshots + recording
        run: run-demo.sh 2>&1 | tee "$OUT/logs/run-demo.log"

      - name: Stop VVD
        if: always()
        run: |
          cp -r ~/vega/logs "$OUT/logs/vega-logs" 2>/dev/null || true
          stop-vvd.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvd-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
